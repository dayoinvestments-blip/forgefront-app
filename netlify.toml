[build]
  publish = "."
  functions = "netlify/functions"
  # Static single-file HTML app — no build step. Prevents Netlify from
  # auto-detecting the legacy Expo package.json and running Metro.
  command = "echo 'No build step — static site'"

[functions."sow-lineitems"]
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
